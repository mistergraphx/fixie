<!DOCTYPE html>
<html>
<head>
	<title>Fixie.js Sample</title>

	<style>
		body{
			font-family: Helvetica, arial, sans-serif;
			max-width:800px;
			margin:150px auto;
		}
		img{
			width:400px;
			height:300px;
			float:right;
			margin:20px;
		}
	</style>

</head>
<body class="fixie">
	<header>
		<nav>
			<ul>
				<li></li>
				<li></li>
				<li></li>
				<li></li>
				<li></li>
			</ul>
		</nav>
	</header>
	<main>
		<article>
			<h1></h1>
			<p></p>
			<section>
				<!-- Ignored elements -->
				<div></div>
				<hr>
				<span class="icon"></span>
				<i class="icon"></i>
			</section>
			<p> Check us out at <a href="" title=""></a>,
				and don't forget to view source.</p>
			<section>
				<p></p>
				<img/>
				<ul></ul>
				<p></p>
				<ol></ol>
			</section>
			<h2></h2>
			<section></section>
		</article>

	</main>
	<footer>
		<ul>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
		</ul>
	</footer>

	<script src="fixie.js"></script>
	<script>
		// Change default dictionary
		var words= ["Quand il", "me prends", "dans ces bras", "et que", "parle", "sans compter", "mais j'aurais cru", "en plus"];
		fixie.setWordLibrary(words).init();
		// Changes default image service to Picsum
 		fixie.setImagePlaceholder('https://picsum.photos/${w}/${h}/${text}').init();
	</script>
</body>
</html>
